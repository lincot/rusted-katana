[workspace]
members = [
    "1kyu/*",
    "2kyu/*",
    "3kyu/*",
    "4kyu/*",
    "5kyu/*",
    "6kyu/*",
    "7kyu/*",
    "8kyu/*",
    "agg-speedups",
    "bench",
    "char-to-lower",
    "check-katas",
    "digital",
    "progress-bars",
]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
# kata solutions
bytecount = "0.6.9"
char-to-lower = { path = "./char-to-lower" }
chrono = { version = "0.4.43", default-features = false, features = ["std"] }
digital = { path = "./digital" }
either = "1.15.0"
hashbrown = { version = "0.16.1", features = ["nightly"] }
heapless = "0.9.2"
libm = { version = "0.2.16", features = ["unstable"] }
num-bigint = "0.4.6"
num-complex = "0.4.6"
num-integer = "0.1.46"
num-prime = "0.4.4"
radsort = { git = "https://github.com/JakubValtar/radsort" }
rand = { version = "0.10.0", default-features = false, features = ["std"] }
rustc-hash = "2.1.1"
ryu = "1.0.23"
unchecked-std = "1.1.1"
unroll-lite = "0.1"
vqsort-rs = "0.3.0"

# tests/benches
criterion = "0.8.2"
num-traits = "0.2.19"
paste = "1"
rand_pcg = "0.10.1"

# check-katas/progress-bars/bench/agg-speedups
# TODO we could go faster than serde_json... for both writing and reading.
ab_glyph = "0.2.32"
html-escape = "0.2.13"
image = "0.25.9"
imageproc = "0.26.0"
plotters = { version = "0.3", default-features = false, features = ["svg_backend"] }
reqwest = "0.13.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49.0", features = ["full"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cognitive_complexity = "allow"
debug_assert_with_mut_call = "allow"
default_trait_access = "allow"
float_cmp = "allow"
implicit_hasher = "allow"
manual_div_ceil = "allow"
manual_midpoint = "allow"
many_single_char_names = "allow"
maybe_infinite_iter = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
new_without_default = "allow"
range_plus_one = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
suspicious_operation_groupings = "allow"
too_many_lines = "allow"
type_complexity = "allow"
uninit_assumed_init = "allow"
uninit_vec = "allow"
unused_io_amount = "allow"
while_float = "allow"
zero_sized_map_values = "allow"
manual_assert_eq = "allow"
assert_is_empty = "allow"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
